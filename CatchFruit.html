<html>
    <head>
        <title>接水果游戏</title>
    </head>
    <body>
        <p id="apple">⬜⬜⬜🍎⬜</p>
        <p id="basket">⬜⬜🧺⬜⬜</p>
        <button onclick="Left()">向左 / Left</button>
        <button onclick="Right()">向右 / Right</button>
        <script>
            var ApplePos=4,BasketPos=3;
            function Left(){
                BasketPos--;
                if(BasketPos<=0)BasketPos++;
                Show();
            }
            function Right(){
                BasketPos++;
                if(BasketPos>=6)BasketPos--;
                Show();
            }
            function Show(){
                var BasketLine='',AppleLine='';
                for(var i=1;i<=5;i++){
                    if(i===ApplePos){
                        AppleLine+='🍎';
                    }else{
                        AppleLine+='⬜';
                    }
                }
                for(var i=1;i<=5;i++){
                    if(i===BasketPos){
                        BasketLine+='🧺';
                    }else{
                        BasketLine+='⬜';
                    }
                }
                var current=document.getElementById('apple');
                current=AppleLine;
                document.getElementById('apple').textContent=current;
                
                current=BasketLine;
                document.getElementById('basket').textContent=current;
            }
        </script>
    </body>
</html>
