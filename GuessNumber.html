<html>
    <head>
        <title>猜数字游戏</title>
        <style>
            body{background-color:aliceblue;}
        </style>
    </head>
    <body>
        <input id="ipt" type="text" placeholder="输入100以内的数字 / Input a number that is less than 100"></input>
        <script>var a=Math.floor(Math.random()*100)+1</script>
        <script>
            function Func(){
                var num=document.getElementById("ipt").value;
                if(num<1 || num>100 || isNaN(num)){
                    alert("输入无效，请重新输入 / The input was invalid,please input again");
                    return;
                }
                if(num>a){
                    alert('大了 / Too big!');
                }else if(num<a){
                    alert('小了 / Too small!');
                }else{
                    alert("对了！/ It's right!");
                    a=Math.floor(Math.random()*100)+1
                }
            }
        </script>
        <button onclick="Func()">猜 / Guess</button>
        <br>
        <a href="index.html">👈 回到首页 / Back to Home</a>
   </body>
</html>
